<style>
:root{
  --bg:#faf6f1; --card:#ffffff; --ink:#2b1a10; --muted:#7a6656; --line:#eaded2;
  --brand:#7a4220; --brand2:#a45f33; --accent:#d4a373; --soft:#f4ebe1;
  --danger:#b3261e; --ok:#2e7d32; --warn:#b26a00;
  --in-bg:#e6f2e7; --in-fg:#1f6a27; --out-bg:#fbe6e3; --out-fg:#a3281f; --non-bg:#e7ecf5; --non-fg:#36508a;
  --shadow:0 1px 2px rgba(60,30,10,.06),0 4px 14px rgba(60,30,10,.06);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- Auth ---------- */
#auth{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;padding-top:max(24px,env(safe-area-inset-top))}
.auth-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px;box-shadow:var(--shadow)}
.auth-logo{display:block;width:84px;height:84px;margin:0 auto 10px;border-radius:20px}
.auth-card h1{margin:0;text-align:center;font-size:24px;letter-spacing:.2px;color:var(--brand)}
.auth-card .tag{margin:2px 0 18px;text-align:center;color:var(--muted);font-size:13px}
.tabs{display:flex;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.12)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);outline:none}
.inp:focus{border-color:var(--brand2);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand2) 22%,transparent)}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);padding:6px 8px;font-size:12px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:12px;font-weight:600;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff}
.btn.danger{color:var(--danger)}
.btn.block{width:100%;margin-top:16px;padding:12px}
.btn[disabled]{opacity:.55;pointer-events:none}
.link{background:none;border:0;color:var(--brand);font-weight:600;padding:6px;font-size:13px}
.msg{margin-top:12px;font-size:13px;color:var(--danger);min-height:18px;text-align:center}
.msg.ok{color:var(--ok)}

/* ---------- App ---------- */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-in{max-width:980px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;color:var(--brand);letter-spacing:.2px}
.brand img{width:32px;height:32px;border-radius:9px}
.spacer{flex:1}
.who{font-size:12px;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:980px;margin:0 auto;padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.search{position:relative;flex:1 1 260px}
.search input{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip small{opacity:.75;font-weight:500;margin-left:3px}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 10px;color:var(--muted);font-size:13px}
.meta select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 8px;font-size:13px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.row1{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.kode{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--soft);color:var(--brand);padding:6px 10px;border-radius:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;font-size:14px;word-break:break-all;text-align:left}
.kode.copied{background:var(--ok);color:#fff}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.b-in{background:var(--in-bg);color:var(--in-fg)} .b-out{background:var(--out-bg);color:var(--out-fg)} .b-non{background:var(--non-bg);color:var(--non-fg)}
.kontak{margin-top:9px;font-weight:700}
.ket{margin:3px 0 0;color:var(--muted);font-size:14px}
details{margin-top:10px}
summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--brand2);list-style:none;padding:4px 0}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
.jr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.jr .j{background:var(--soft);border-radius:11px;padding:9px 11px;font-size:13px}
.jr .j span{display:block;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-bottom:2px}
.jr .d span{color:var(--in-fg)} .jr .k span{color:var(--out-fg)}
.actions{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.actions button{border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;padding:6px 9px;border-radius:9px}
.actions button:hover{background:var(--soft)}
.actions .del{color:var(--danger)}
mark{background:#ffe08a;color:#2b1a10;border-radius:3px;padding:0 1px}
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty img{width:92px;height:92px;opacity:.9;border-radius:22px}
.empty h3{color:var(--ink);margin:12px 0 4px}
.more{display:block;margin:6px auto 0}

.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:15;border-radius:999px;padding:14px 20px;box-shadow:0 6px 18px rgba(80,40,10,.35)}

/* ---------- Modal ---------- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(20,10,5,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));border:1px solid var(--line)}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin:0 0 4px;font-size:18px;color:var(--brand)}
.sheet .sub{margin:0 0 6px;color:var(--muted);font-size:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.g2{grid-template-columns:1fr}}
textarea.inp{resize:vertical;min-height:70px}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat small{color:var(--muted);font-weight:600}
.stat.n b{color:var(--ok)} .stat.u b{color:var(--warn)}
.plan{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.pi{padding:8px 11px;border-bottom:1px solid var(--line);font-size:13px}
.pi:last-child{border-bottom:0}
.pi code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;color:var(--brand)}
.tg{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;margin-right:6px}
.tg.n{background:var(--in-bg);color:var(--in-fg)} .tg.u{background:#fff0d6;color:var(--warn)}
.pi small{display:block;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .2s}

#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#2b1a10;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100}
#splash img{width:84px;height:84px;border-radius:20px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.92);opacity:.7}}
</style>

<body>

<div id="splash"><img data-logo alt=""></div>

<!-- ===== Login ===== -->
<section id="auth" class="hidden">
  <div class="auth-card">
    <img class="auth-logo" data-logo alt="Essencode">
    <h1>Essencode</h1>
    <p class="tag">Rekap &amp; pencarian kode transaksi</p>
    <div class="tabs">
      <button id="tabLogin" class="on" type="button">Masuk</button>
      <button id="tabReg" type="button">Daftar</button>
    </div>
    <label class="f" for="email">Email</label>
    <input id="email" class="inp" type="email" autocomplete="email" inputmode="email" placeholder="nama@email.com">
    <label class="f" for="pass">Password</label>
    <div class="pw">
      <input id="pass" class="inp" type="password" autocomplete="current-password" placeholder="Minimal 6 karakter">
      <button id="togglePw" type="button">Lihat</button>
    </div>
    <button id="authBtn" class="btn primary block" type="button">Masuk</button>
    <div style="text-align:center;margin-top:8px"><button id="forgot" class="link" type="button">Lupa password?</button></div>
    <div id="authMsg" class="msg"></div>
  </div>
</section>

<!-- ===== Aplikasi ===== -->
<div id="app" class="hidden">
  <header class="top"><div class="top-in">
    <div class="brand"><img data-logo alt="">Essencode</div>
    <div class="spacer"></div>
    <span class="who" id="who"></span>
    <button id="logout" class="btn" type="button" style="padding:7px 11px;font-size:13px">Keluar</button>
  </div></header>

  <main>
    <div class="tools">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" class="inp" type="search" placeholder="Cari kode, kontak, keterangan, atau akun…" autocomplete="off">
      </div>
      <button id="btnImport" class="btn" type="button">⬆ Impor Excel</button>
      <button id="btnExport" class="btn" type="button">⬇ Ekspor</button>
      <input id="file" type="file" accept=".xlsx,.xls,.csv" class="hidden">
    </div>
    <div id="chips" class="chips"></div>
    <div class="meta">
      <span id="count"></span>
      <select id="sort" aria-label="Urutkan">
        <option value="kode">Urut: Kode A–Z</option>
        <option value="kontak">Urut: Nama Kontak</option>
        <option value="dana">Urut: Dana</option>
        <option value="baru">Urut: Terbaru diubah</option>
      </select>
    </div>
    <div id="list"></div>
  </main>
  <button id="btnAdd" class="btn primary fab" type="button">＋ Tambah Kode</button>
</div>

<!-- ===== Modal form ===== -->
<div id="ovForm" class="ov hidden"><div class="sheet">
  <h2 id="formTitle">Tambah Kode</h2>
  <p class="sub">Kombinasi <b>Kode Transaksi + Nama Kontak</b> bersifat unik. Jika sama dengan data yang ada, data lama diganti.</p>
  <div class="g2">
    <div><label class="f" for="fKode">Kode Transaksi *</label><input id="fKode" class="inp" autocapitalize="characters" placeholder="CR-P-PRK-XXXX"></div>
    <div><label class="f" for="fDana">Dana</label><input id="fDana" class="inp" list="dlDana" placeholder="Dana Masuk / Dana Keluar / Non-Kas"></div>
  </div>
  <label class="f" for="fKontak">Nama Kontak</label><input id="fKontak" class="inp" placeholder="Nama kontak (isi - jika tidak ada)">
  <label class="f" for="fKet">Keterangan</label><textarea id="fKet" class="inp"></textarea>
  <div class="g2">
    <div><label class="f" for="fD1">Debit 1</label><input id="fD1" class="inp" list="dlAkun"></div>
    <div><label class="f" for="fK1">Kredit 1</label><input id="fK1" class="inp" list="dlAkun"></div>
    <div><label class="f" for="fD2">Debit 2</label><input id="fD2" class="inp" list="dlAkun"></div>
    <div><label class="f" for="fK2">Kredit 2</label><input id="fK2" class="inp" list="dlAkun"></div>

<!-- ===== Modal impor ===== -->
<div id="ovImport" class="ov hidden"><div class="sheet">
  <h2>Pratinjau Impor</h2>
  <p class="sub" id="impFile"></p>
  <div class="stats">
    <div class="stat n"><b id="sNew">0</b><small>Kode baru</small></div>
    <div class="stat u"><b id="sUpd">0</b><small>Diganti</small></div>
    <div class="stat"><b id="sSame">0</b><small>Sama (dilewati)</small></div>
  </div>
  <div id="plan" class="plan"></div>
  <p class="note" id="impNote"></p>
  <div class="bar hidden" id="barWrap"><i id="bar"></i></div>
  <div class="foot"><button id="impCancel" class="btn" type="button">Batal</button><button id="impGo" class="btn primary" type="button">Terapkan Impor</button></div>
</div></div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, writeBatch, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ================= Firebase ================= */
const firebaseConfig = {
  apiKey: "AIzaSyClpXgUk_Ggcajzslk6oyTpTnnVrv9K66s",
  authDomain: "essencode-304b8.firebaseapp.com",
  projectId: "essencode-304b8",
  storageBucket: "essencode-304b8.firebasestorage.app",
  messagingSenderId: "2698994645",
  appId: "1:2698994645:web:9c31751787d4cff05ed35c"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
let db;
try {
  db = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
} catch (e) {
  db = initializeFirestore(fbApp, {});
}

/* ================= Util ================= */
const $ = s => document.querySelector(s);
const FIELDS = ['dana','kontak','kode','keterangan','debit1','kredit1','debit2','kredit2'];
const LABEL = { dana:'Dana', kontak:'Nama Kontak', kode:'Kode Transaksi', keterangan:'Keterangan', debit1:'Debit 1', kredit1:'Kredit 1', debit2:'Debit 2', kredit2:'Kredit 2' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').replace(/\s+/g, ' ').trim();
const slug = s => norm(s).toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 120);
const makeId = (kode, kontak) => (slug(kode) || 'x') + '__' + (slug(kontak) || 'x');
const reEsc = t => t.replace(/[.*+?^$(){}|[\]\\]/g, '\\$&');

function hl(text, terms) {
  text = String(text ?? '');
  if (!terms.length) return esc(text);
  const re = new RegExp('(' + terms.map(reEsc).join('|') + ')', 'gi');
  return text.split(re).map((p, i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('');
}
function acct(s, terms) {
  s = String(s || '');
  const m = s.match(/^(\d-\d{4,6})\s+([\s\S]*)$/);
  return m ? '<b>' + hl(m[1], terms) + '</b> ' + hl(m[2], terms) : hl(s, terms);
}
function danaClass(d) {
  d = String(d || '').toLowerCase();
  if (d.includes('masuk')) return 'b-in';
  if (d.includes('keluar')) return 'b-out';
  if (d.includes('non')) return 'b-non';
  return '';
}
let toastT;
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms);
}
const show = (el, on = true) => el.classList.toggle('hidden', !on);

/* ================= Auth UI ================= */
let mode = 'login';
function setMode(m) {
  mode = m;
  $('#tabLogin').classList.toggle('on', m === 'login');
  $('#tabReg').classList.toggle('on', m === 'reg');
  $('#authBtn').textContent = m === 'login' ? 'Masuk' : 'Buat Akun';
  $('#pass').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  $('#authMsg').textContent = '';
}
$('#tabLogin').onclick = () => setMode('login');
$('#tabReg').onclick = () => setMode('reg');
$('#togglePw').onclick = () => {
  const p = $('#pass'); const h = p.type === 'password';
  p.type = h ? 'text' : 'password'; $('#togglePw').textContent = h ? 'Sembunyi' : 'Lihat';
};
const authErr = c => ({
  'auth/invalid-credential': 'Email atau password salah.',
  'auth/invalid-login-credentials': 'Email atau password salah.',
  'auth/wrong-password': 'Password salah.',
  'auth/user-not-found': 'Akun tidak ditemukan.',
  'auth/invalid-email': 'Format email tidak valid.',
  'auth/missing-password': 'Password belum diisi.',
  'auth/email-already-in-use': 'Email sudah terdaftar. Silakan masuk.',
  'auth/weak-password': 'Password minimal 6 karakter.',
  'auth/too-many-requests': 'Terlalu banyak percobaan. Coba lagi nanti.',
  'auth/network-request-failed': 'Tidak ada koneksi internet.',
  'auth/unauthorized-domain': 'Domain ini belum diizinkan. Tambahkan di Firebase Authentication → Settings → Authorized domains.',
  'auth/operation-not-allowed': 'Metode Email/Password belum diaktifkan di Firebase.'
}[c] || ('Terjadi kesalahan (' + c + ').'));

async function doAuth() {
  const email = $('#email').value.trim(), pass = $('#pass').value;
  const msg = $('#authMsg'); msg.className = 'msg'; msg.textContent = '';
  if (!email || !pass) { msg.textContent = 'Email dan password wajib diisi.'; return; }
  $('#authBtn').disabled = true;
  try {
    if (mode === 'login') await signInWithEmailAndPassword(auth, email, pass);
    else await createUserWithEmailAndPassword(auth, email, pass);
  } catch (e) { msg.textContent = authErr(e.code); }
  $('#authBtn').disabled = false;
}
$('#authBtn').onclick = doAuth;
$('#pass').addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });
$('#email').addEventListener('keydown', e => { if (e.key === 'Enter') $('#pass').focus(); });
$('#forgot').onclick = async () => {
  const email = $('#email').value.trim(); const msg = $('#authMsg');
  if (!email) { msg.className = 'msg'; msg.textContent = 'Isi email dulu, lalu tekan "Lupa password?".'; return; }
  try { await sendPasswordResetEmail(auth, email); msg.className = 'msg ok'; msg.textContent = 'Tautan reset password dikirim ke email Anda.'; }
  catch (e) { msg.className = 'msg'; msg.textContent = authErr(e.code); }
};
$('#logout').onclick = () => { if (confirm('Keluar dari akun?')) signOut(auth); };

/* ================= Data ================= */
let uid = null, unsub = null, loaded = false;
let data = new Map();           // id -> record
let filterDana = '', sortBy = 'kode', query = '', limit = 100;

onAuthStateChanged(auth, user => {
  const sp = $('#splash'); if (sp) sp.remove();
  if (unsub) { unsub(); unsub = null; }
  data = new Map(); loaded = false;
  if (user) {
    uid = user.uid;
    $('#who').textContent = user.email || '';
    show($('#auth'), false); show($('#app'), true);
    render();
    unsub = onSnapshot(collection(db, 'users', uid, 'codes'), snap => {
      const m = new Map();
      snap.forEach(d => { const v = d.data(); m.set(d.id, { id: d.id, ...v, _t: v.updatedAt && v.updatedAt.toMillis ? v.updatedAt.toMillis() : Date.now() }); });
      data = m; loaded = true; render();
    }, err => {
      console.error(err);
      toast(err.code === 'permission-denied' ? 'Akses ditolak — periksa Firestore Rules (lihat README).' : 'Gagal memuat data: ' + err.code, 6000);
    });
  } else {
    uid = null;
    show($('#app'), false); show($('#auth'), true);
    $('#pass').value = '';
  }
});

const colRef = () => collection(db, 'users', uid, 'codes');
const payload = (r, source) => ({
  dana: r.dana, kontak: r.kontak, kode: r.kode, keterangan: r.keterangan,
  debit1: r.debit1, kredit1: r.kredit1, debit2: r.debit2, kredit2: r.kredit2,
  source, updatedAt: serverTimestamp()
});
const clean = r => { const o = {}; FIELDS.forEach(f => o[f] = norm(r[f])); return o; };

/* ================= Render ================= */
function haystack(r) { return (r.kode + ' ' + r.kontak + ' ' + r.dana + ' ' + r.keterangan + ' ' + r.debit1 + ' ' + r.kredit1 + ' ' + r.debit2 + ' ' + r.kredit2).toLowerCase(); }

function render() {
  const all = [...data.values()];
  // chips
  const counts = {};
  all.forEach(r => { const k = r.dana || '(tanpa dana)'; counts[k] = (counts[k] || 0) + 1; });
  if (filterDana && !counts[filterDana]) filterDana = '';
  $('#chips').innerHTML =
    '<button class="chip ' + (!filterDana ? 'on' : '') + '" data-d="">Semua<small>' + all.length + '</small></button>' +
    Object.keys(counts).sort().map(k => '<button class="chip ' + (filterDana === k ? 'on' : '') + '" data-d="' + esc(k) + '">' + esc(k) + '<small>' + counts[k] + '</small></button>').join('');

  // datalists
  $('#dlDana').innerHTML = [...new Set(['Dana Masuk', 'Dana Keluar', 'Non-Kas', ...all.map(r => r.dana).filter(Boolean)])].map(v => '<option value="' + esc(v) + '">').join('');
  $('#dlAkun').innerHTML = [...new Set(all.flatMap(r => [r.debit1, r.kredit1, r.debit2, r.kredit2]).filter(Boolean))].sort().map(v => '<option value="' + esc(v) + '">').join('');

  // filter + search
  const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
  let rows = all.filter(r => (!filterDana || (r.dana || '(tanpa dana)') === filterDana) && terms.every(t => haystack(r).includes(t)));
  const cmp = (a, b, k) => String(a[k] || '').localeCompare(String(b[k] || ''), 'id', { numeric: true });
  rows.sort((a, b) =>
    sortBy === 'baru' ? b._t - a._t :
    sortBy === 'dana' ? (cmp(a, b, 'dana') || cmp(a, b, 'kode')) :
    sortBy === 'kontak' ? (cmp(a, b, 'kontak') || cmp(a, b, 'kode')) : cmp(a, b, 'kode'));

  $('#count').textContent = !loaded ? 'Memuat data…' :
    (terms.length || filterDana) ? rows.length + ' dari ' + all.length + ' kode' : all.length + ' kode';

  const list = $('#list');
  if (loaded && !all.length) {
    list.innerHTML = '<div class="empty"><img src="' + window.LOGO + '" alt=""><h3>Belum ada kode</h3><p>Mulai dengan impor file Excel,<br>atau tambah kode secara manual.</p><button class="btn primary" id="emptyImport" type="button">⬆ Impor Excel</button></div>';
    return;
  }
  if (loaded && !rows.length) { list.innerHTML = '<div class="empty"><h3>Tidak ditemukan</h3><p>Coba kata kunci lain.</p></div>'; return; }

  const shown = rows.slice(0, limit);
  list.innerHTML = shown.map(r => {
    const j1 = (r.debit1 || r.kredit1), j2 = (r.debit2 || r.kredit2);
    const jr = (n, d, k) => (d || k) ? '<div class="jr">' +
      '<div class="j d"><span>Debit ' + n + '</span>' + (d ? acct(d, terms) : '—') + '</div>' +
      '<div class="j k"><span>Kredit ' + n + '</span>' + (k ? acct(k, terms) : '—') + '</div></div>' : '';
    return '<article class="card" data-id="' + esc(r.id) + '">' +
      '<div class="row1"><button class="kode" type="button" data-copy="' + esc(r.kode) + '" title="Salin kode">' + hl(r.kode, terms) +
      ' <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>' +
      (r.dana ? '<span class="badge ' + danaClass(r.dana) + '">' + hl(r.dana, terms) + '</span>' : '') + '</div>' +
      '<div class="kontak">' + hl(r.kontak || '-', terms) + '</div>' +
      (r.keterangan ? '<p class="ket">' + hl(r.keterangan, terms) + '</p>' : '') +
      ((j1 || j2) ? '<details' + (terms.length ? ' open' : '') + '><summary>Lihat jurnal</summary>' + jr(1, r.debit1, r.kredit1) + jr(2, r.debit2, r.kredit2) + '</details>' : '') +
      '<div class="actions"><button type="button" data-edit>Ubah</button><button type="button" class="del" data-del>Hapus</button></div>' +
      '</article>';
  }).join('') + (rows.length > limit ? '<button class="btn more" id="more" type="button">Tampilkan lebih banyak (' + (rows.length - limit) + ')</button>' : '');
}

/* ================= Events ================= */
let qT;
$('#q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { query = e.target.value.trim(); limit = 100; render(); }, 120); });
$('#sort').onchange = e => { sortBy = e.target.value; render(); };
$('#chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; filterDana = b.dataset.d; limit = 100; render(); });
$('#list').addEventListener('click', async e => {
  if (e.target.closest('#more')) { limit += 100; render(); return; }
  if (e.target.closest('#emptyImport')) { $('#file').click(); return; }
  const card = e.target.closest('.card'); if (!card) return;
  const rec = data.get(card.dataset.id);
  const cp = e.target.closest('[data-copy]');
  if (cp) {
    try { await navigator.clipboard.writeText(cp.dataset.copy); }
    catch { const t = document.createElement('textarea'); t.value = cp.dataset.copy; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
    cp.classList.add('copied'); toast('Kode disalin: ' + cp.dataset.copy, 1500); setTimeout(() => cp.classList.remove('copied'), 900); return;
  }
  if (e.target.closest('[data-edit]') && rec) openForm(rec);
  if (e.target.closest('[data-del]') && rec) {
    if (!confirm('Hapus kode ' + rec.kode + (rec.kontak && rec.kontak !== '-' ? ' (' + rec.kontak + ')' : '') + '?')) return;
    try { const b = writeBatch(db); b.delete(doc(db, 'users', uid, 'codes', rec.id)); await b.commit(); toast('Kode dihapus'); }
    catch (err) { toast('Gagal menghapus: ' + err.code, 4000); }
  }
});

/* ================= Form tambah / ubah ================= */
let editingId = null;
const fMap = { kode:'#fKode', dana:'#fDana', kontak:'#fKontak', keterangan:'#fKet', debit1:'#fD1', kredit1:'#fK1', debit2:'#fD2', kredit2:'#fK2' };
function openForm(rec) {
  editingId = rec ? rec.id : null;
  $('#formTitle').textContent = rec ? 'Ubah Kode' : 'Tambah Kode';
  Object.entries(fMap).forEach(([f, sel]) => $(sel).value = rec ? (rec[f] || '') : '');
  $('#formMsg').textContent = '';
  show($('#ovForm'), true);
  setTimeout(() => $('#fKode').focus(), 50);
}
const closeForm = () => show($('#ovForm'), false);
$('#btnAdd').onclick = () => openForm(null);
$('#fCancel').onclick = closeForm;
$('#ovForm').addEventListener('mousedown', e => { if (e.target.id === 'ovForm') closeForm(); });
$('#fSave').onclick = async () => {
  const r = {}; Object.entries(fMap).forEach(([f, sel]) => r[f] = norm($(sel).value));
  if (!r.kode) { $('#formMsg').textContent = 'Kode Transaksi wajib diisi.'; return; }
  if (!r.kontak) r.kontak = '-';
  const id = makeId(r.kode, r.kontak);
  if (id !== editingId && data.has(id)) {
    if (!confirm('Kode ' + r.kode + ' dengan kontak "' + r.kontak + '" sudah ada.\nGanti data yang lama dengan data ini?')) return;
  }
  $('#fSave').disabled = true;
  try {
    const b = writeBatch(db);
    if (editingId && editingId !== id) b.delete(doc(db, 'users', uid, 'codes', editingId));
    b.set(doc(db, 'users', uid, 'codes', id), payload(r, 'manual'));
    await b.commit();
    closeForm(); toast(editingId ? 'Perubahan disimpan' : 'Kode ditambahkan');
  } catch (err) { $('#formMsg').textContent = 'Gagal menyimpan: ' + err.code; }
  $('#fSave').disabled = false;
};

/* ================= Impor Excel ================= */
let plan = null;
$('#btnImport').onclick = () => {
  if (!loaded) return toast('Data masih dimuat, tunggu sebentar…');
  $('#file').click();
};
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  if (!window.XLSX) return toast('Library Excel belum termuat. Periksa koneksi internet lalu muat ulang.', 5000);
  if (!loaded) return toast('Data masih dimuat, coba lagi sebentar lagi.');
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    const rows = parseWorkbook(wb);
    if (!rows.length) return toast('Tidak ada baris kode yang terbaca. Pastikan ada kolom "Kode Transaksi".', 5000);
    plan = buildPlan(rows); plan.fileName = f.name;
    showPlan();
  } catch (err) { console.error(err); toast('Gagal membaca file: ' + (err.message || err), 5000); }
});

function parseWorkbook(wb) {
  const out = [];
  const keyOf = h => {
    h = norm(h).toLowerCase();
    return { 'dana':'dana', 'nama kontak':'kontak', 'kontak':'kontak', 'kode transaksi':'kode', 'kode':'kode', 'keterangan':'keterangan',
      'debit 1':'debit1', 'kredit 1':'kredit1', 'debit 2':'debit2', 'kredit 2':'kredit2', 'debit1':'debit1', 'kredit1':'kredit1', 'debit2':'debit2', 'kredit2':'kredit2' }[h];
  };
  for (const name of wb.SheetNames) {
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '', raw: false });
    const hi = aoa.findIndex(r => r.some(c => ['kode transaksi', 'kode'].includes(norm(c).toLowerCase())));
    if (hi < 0) continue;
    const col = {}; aoa[hi].forEach((h, i) => { const k = keyOf(h); if (k && !(k in col)) col[k] = i; });
    if (!('kode' in col)) continue;
    for (let i = hi + 1; i < aoa.length; i++) {
      const row = aoa[i]; const o = {};
      FIELDS.forEach(f => o[f] = f in col ? norm(row[col[f]]) : '');
      if (!o.kode) continue;                 // lewati baris kosong / catatan
      if (!o.kontak) o.kontak = '-';
      out.push(o);
    }
  }
  return out;
}

function buildPlan(rows) {
  // 1) gabungkan duplikat di dalam file (baris terakhir menang)
  const inFile = new Map(); let dupFile = 0;
  rows.forEach(r => { const id = makeId(r.kode, r.kontak); if (inFile.has(id)) dupFile++; inFile.set(id, { ...r, id }); });
  const incoming = [...inFile.values()];
  const fileKodeCount = {}; incoming.forEach(r => { const k = r.kode.toLowerCase(); fileKodeCount[k] = (fileKodeCount[k] || 0) + 1; });
  const dbByKode = {}; data.forEach(r => { const k = String(r.kode).toLowerCase(); (dbByKode[k] = dbByKode[k] || []).push(r); });

  const add = [], upd = [], same = []; const usedOld = new Set();
  incoming.forEach(r => {
    let old = data.get(r.id);
    if (!old) {
      // kode sama & unik di kedua sisi, tetapi nama kontak berubah -> anggap penggantian
      const k = r.kode.toLowerCase();
      if (fileKodeCount[k] === 1 && dbByKode[k] && dbByKode[k].length === 1 && !usedOld.has(dbByKode[k][0].id)) old = dbByKode[k][0];
    }
    if (!old) { add.push(r); return; }
    usedOld.add(old.id);
    const diffs = FIELDS.filter(f => norm(old[f]) !== norm(r[f]));
    if (!diffs.length) same.push(r); else upd.push({ old, rec: r, diffs });
  });
  return { add, upd, same, dupFile, total: incoming.length };
}

function showPlan() {
  $('#impFile').textContent = plan.fileName + ' · ' + plan.total + ' kode terbaca';
  $('#sNew').textContent = plan.add.length; $('#sUpd').textContent = plan.upd.length; $('#sSame').textContent = plan.same.length;
  const items = [
    ...plan.add.map(r => '<div class="pi"><span class="tg n">BARU</span><code>' + esc(r.kode) + '</code> · ' + esc(r.kontak) + '</div>'),
    ...plan.upd.map(u => '<div class="pi"><span class="tg u">GANTI</span><code>' + esc(u.rec.kode) + '</code> · ' + esc(u.rec.kontak) + '<small>Berubah: ' + u.diffs.map(f => LABEL[f]).join(', ') + '</small></div>')
  ];
  $('#plan').innerHTML = items.length ? items.slice(0, 300).join('') + (items.length > 300 ? '<div class="pi"><small>…dan ' + (items.length - 300) + ' lainnya</small></div>' : '') : '<div class="pi"><small>Tidak ada perubahan — semua kode di file sudah sama dengan data yang tersimpan.</small></div>';
  $('#impNote').textContent = 'Kode yang sama diganti (tidak dobel), kode baru ditambahkan, yang identik dilewati.' + (plan.dupFile ? ' ' + plan.dupFile + ' baris ganda di dalam file digabung (baris terakhir dipakai).' : '') + ' Kode yang tidak ada di file tidak dihapus.';
  $('#impGo').disabled = !(plan.add.length || plan.upd.length);
  show($('#barWrap'), false); $('#bar').style.width = '0';
  show($('#ovImport'), true);
}
$('#impCancel').onclick = () => { if (!$('#impGo').dataset.busy) { show($('#ovImport'), false); plan = null; } };
$('#impGo').onclick = async () => {
  if (!plan) return;
  if (!navigator.onLine) return toast('Tidak ada koneksi internet. Impor membutuhkan koneksi.', 4000);
  const ops = [
    ...plan.add.map(r => ({ r })),
    ...plan.upd.map(u => ({ r: u.rec, delId: u.old.id !== u.rec.id ? u.old.id : null }))
  ];
  const btn = $('#impGo'); btn.disabled = true; btn.dataset.busy = '1'; btn.textContent = 'Menyimpan…';
  show($('#barWrap'), true);
  try {
    const CH = 200; let done = 0;
    for (let i = 0; i < ops.length; i += CH) {
      const b = writeBatch(db);
      ops.slice(i, i + CH).forEach(({ r, delId }) => {
        if (delId) b.delete(doc(db, 'users', uid, 'codes', delId));
        b.set(doc(db, 'users', uid, 'codes', r.id), payload(r, 'import'));
      });
      await b.commit(); done += Math.min(CH, ops.length - i);
      $('#bar').style.width = Math.round(done / ops.length * 100) + '%';
    }
    toast('Impor selesai: ' + plan.add.length + ' baru, ' + plan.upd.length + ' diganti', 4000);
    show($('#ovImport'), false); plan = null;
  } catch (err) { console.error(err); toast('Impor gagal: ' + (err.code || err.message), 6000); }
  delete btn.dataset.busy; btn.textContent = 'Terapkan Impor'; btn.disabled = false;
};

/* ================= Ekspor ================= */
$('#btnExport').onclick = () => {
  if (!window.XLSX) return toast('Library Excel belum termuat. Periksa koneksi internet.', 4000);
  const all = [...data.values()].sort((a, b) => String(a.kode).localeCompare(String(b.kode), 'id', { numeric: true }));
  if (!all.length) return toast('Belum ada data untuk diekspor.');
  // urutan kolom sama seperti file asli, sehingga bisa diimpor ulang
  const order = ['dana', 'kontak', 'kode', 'keterangan', 'debit1', 'kredit1', 'debit2', 'kredit2'];
  const aoa = [['Ringkasan Kode Transaksi'], [], order.map(f => LABEL[f])];
  all.forEach(r => aoa.push(order.map(f => r[f] || '')));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{ wch: 12 }, { wch: 30 }, { wch: 20 }, { wch: 60 }, { wch: 42 }, { wch: 42 }, { wch: 42 }, { wch: 42 }];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Kode Transaksi');
  XLSX.writeFile(wb, 'Essencode-Rekap-Kode.xlsx');
  toast('File Excel diunduh');
};

/* ================= Service worker ================= */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
}
</script>
